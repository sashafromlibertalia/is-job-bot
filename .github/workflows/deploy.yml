name: Deploy

on:
    push:
        branches: [ main ]
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5
            -   name: Setup SSH
                run: |
                    mkdir -p ~/.ssh
                    echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                    chmod 600 ~/.ssh/id_ed25519
                    ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts
                env:
                    SSH_HOST: ${{ secrets.SSH_HOST }}
                    SSH_PORT: ${{ secrets.SSH_PORT }}

            -   name: Rsync source to server
                run: |
                    rsync -az --delete \
                      --exclude='.git/' \
                      --exclude='.github/' \
                      --exclude='node_modules/' \
                      --exclude='dist/' \
                      --exclude='.env' \
                      --exclude='.idea/' \
                      --exclude='.vscode/' \
                      -e "ssh -p ${SSH_PORT} -i ~/.ssh/id_ed25519" \
                      ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"
                env:
                    SSH_HOST: ${{ secrets.SSH_HOST }}
                    SSH_USER: ${{ secrets.SSH_USER }}
                    SSH_PORT: ${{ secrets.SSH_PORT }}
                    DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

            -   name: Write .env on server
                uses: appleboy/ssh-action@v1
                with:
                    host: ${{ secrets.SSH_HOST }}
                    username: ${{ secrets.SSH_USER }}
                    port: ${{ secrets.SSH_PORT }}
                    key: ${{ secrets.SSH_PRIVATE_KEY }}
                    envs: BOT_TOKEN,SUPABASE_URL,SUPABASE_KEY,OFFTOP_CHAT_ID,DEPLOY_PATH
                    script: |
                        set -e
                        umask 077
                        tmp="$(mktemp)"
                        cat > "$tmp" <<EOF
                        BOT_TOKEN=${BOT_TOKEN}
                        SUPABASE_URL=${SUPABASE_URL}
                        SUPABASE_KEY=${SUPABASE_KEY}
                        OFFTOP_CHAT_ID=${OFFTOP_CHAT_ID}
                        EOF
                        mv "$tmp" "${DEPLOY_PATH}/.env"
                env:
                    BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
                    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                    SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
                    OFFTOP_CHAT_ID: ${{ secrets.OFFTOP_CHAT_ID }}
                    DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

            -   name: Install, build and restart
                uses: appleboy/ssh-action@v1
                with:
                    host: ${{ secrets.SSH_HOST }}
                    username: ${{ secrets.SSH_USER }}
                    port: ${{ secrets.SSH_PORT }}
                    key: ${{ secrets.SSH_PRIVATE_KEY }}
                    script: |
                        set -e
                        export NVM_DIR="$HOME/.nvm"
                        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
                        export PATH="$HOME/.local/share/pnpm:$PATH"
                        cd "${{ secrets.DEPLOY_PATH }}"
                        nvm install
                        node -v
                        pnpm install --frozen-lockfile
                        pnpm build
                        pm2 reload is-job-bot --update-env || pm2 start dist/bot.js --name is-job-bot
                        pm2 save
